[project]
name = "web-scraper"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jan Van Look", email = "jan.derpingguys@hotmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "click>=8.5.0",
    "requests>=2.34.2",
]

[project.scripts]
web-scraper = "web_scraper:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "ruff>=0.16.9",
]
